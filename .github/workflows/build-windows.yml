name: Build OpenSteamTool

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: windows-2022 # 使用最新版 Windows 服务器，自带 CMake 和 VS 2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenSteamTool-Binaries
        # 根据你的项目实际输出路径，可能需要调整下面几行
        path: |
          build/**/dwmapi.dll
          build/**/xinput1_4.dll
          build/**/OpenSteamTool.dll
          build/**/*.dll
